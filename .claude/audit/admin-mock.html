<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1C0A3D">
<meta name="robots" content="noindex, nofollow">
<title>หลังบ้าน · ชมรมมุสลิม มช.</title>
<script type="importmap">{"imports":{"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/+esm":"/.claude/audit/mock-supabase.js"}}</script>
<link rel="icon" type="image/png" href="/assets/logo_white_bc.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/assets/admin.css?v=20261013a">
</head>
<body>

<!-- ── หน้าล็อกอิน ──
     data-state: checking (กำลังดูว่าล็อกอินค้างไว้ไหม) · signin · entering
     เริ่มที่ checking เสมอ ปุ่มล็อกอินจะได้ไม่กระพริบขึ้นมาแวบหนึ่งก่อนเข้าระบบ -->
<div class="login" id="loginView" data-state="checking">
  <!-- ฉาก: แสงส่องผ่านแผ่นฉลุลายดาวแปดแฉก มีฝุ่นลอยในลำแสง (วาดใน admin.js) -->
  <div class="scene" id="scene" aria-hidden="true">
    <div class="lattice lattice--base"></div>
    <div class="lattice-glow"><div class="lattice lattice--lit"><div class="light"></div></div></div>
    <canvas class="dust" id="dust"></canvas>
    <div class="vignette"></div>
  </div>

  <div class="login__inner">
    <div class="emblem" id="emblem">
      <div class="emblem__halo"></div>
      <svg class="emblem__star" viewBox="0 0 120 120" aria-hidden="true">
        <defs>
          <!-- ทองแบบโลหะ: แถบสะท้อนแสงเลื่อนผ่านตลอด · ต้นและปลายสีเดียวกันจึงวนต่อได้ไม่มีรอยกระตุก -->
          <linearGradient id="goldSheen" x1="0" y1="0" x2="1" y2="1" spreadMethod="repeat">
            <stop offset="0" stop-color="#9A7209"/>
            <stop offset=".3" stop-color="#E7B008"/>
            <stop offset=".45" stop-color="#FFF4C7"/>
            <stop offset=".55" stop-color="#F4D679"/>
            <stop offset=".8" stop-color="#C79405"/>
            <stop offset="1" stop-color="#9A7209"/>
            <animateTransform attributeName="gradientTransform" type="translate"
                              values="0 0;1 1" dur="4s" repeatCount="indefinite"/>
          </linearGradient>
        </defs>
        <rect x="24" y="24" width="72" height="72" rx="3"/>
        <rect x="24" y="24" width="72" height="72" rx="3" transform="rotate(45 60 60)"/>
      </svg>
      <img class="emblem__logo" src="/assets/logo_white_bc.png" alt="">
    </div>

    <h1 class="login__title">ระบบหลังบ้าน</h1>
    <p class="login__org">ชมรมมุสลิม มหาวิทยาลัยเชียงใหม่</p>

    <p class="login__status" id="loginStatus" role="status" aria-live="polite">กำลังตรวจสอบบัญชี…</p>

    <div class="login__act">
      <div id="loginMsg"></div>
      <button class="gbtn" id="btnLogin" type="button">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/>
          <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
          <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/>
          <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/>
        </svg>
        <span id="btnLoginText">เข้าสู่ระบบด้วย Google</span>
      </button>
      <p class="login__note">ใช้ได้เฉพาะอีเมลที่เจ้าของระบบเพิ่มไว้ในรายชื่อผู้ดูแลแล้ว</p>
    </div>
  </div>
</div>

<!-- ── หน้าหลัก ── -->
<div class="app hidden" id="appView">
  <!-- แถบบนสำหรับจอเล็ก · ซ่อนบนจอใหญ่ -->
  <header class="topbar">
    <button class="topbar__burger" id="btnMenu" aria-label="เปิดเมนู"
            aria-expanded="false" aria-controls="sideNav">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M4 7h16M4 12h16M4 17h16"/>
      </svg>
    </button>
    <span class="topbar__title" id="topTitle">ภาพรวม</span>
  </header>
  <div class="side-scrim" id="sideScrim" hidden></div>

  <aside class="side" id="sideNav">
    <div class="side__brand">
      <img src="/assets/logo_white_bc.png" alt="">
      <b>ชมรมมุสลิม มช.<span>ระบบหลังบ้าน</span></b>
    </div>
    <div class="side__label">เนื้อหา</div>
    <nav id="navContent" aria-label="เนื้อหา"></nav>
    <div class="side__label">ระบบ</div>
    <nav id="navSystem" aria-label="ระบบ"></nav>
    <div class="side__foot">
      <img id="meAvatar" alt="" referrerpolicy="no-referrer"
           src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==">
      <span class="who"><b id="meName">—</b><span id="meEmail"></span></span>
      <button class="side__out" id="btnLogout" type="button">ออกจากระบบ</button>
    </div>
  </aside>

  <main class="main" id="main"></main>
</div>

<script type="module" src="/assets/admin.js?v=20261013a"></script>
</body>
</html>
